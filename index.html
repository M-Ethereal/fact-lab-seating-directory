    outline,
    baseMaterial: wall.material,
    localCenter: wall.geometry.boundingSphere.center.clone(),
    faded: false
  });
  return wall;
}

function geometryAttributeSignature(geometry) {
  return Object.keys(geometry.attributes).sort().map(name => {
    const attribute = geometry.attributes[name];
    return `${name}:${attribute.itemSize}:${attribute.normalized ? 1 : 0}:${attribute.array.constructor.name}`;
  }).join('|');
}

function batchStaticObjects(rootGroup, predicate, createObject) {
  scene.updateMatrixWorld(true);
  const rootInverse = rootGroup.matrixWorld.clone().invert();
  const batches = new Map();

  rootGroup.traverse(object => {
    if (!predicate(object) || !object.geometry || Array.isArray(object.material)) return;
    if (Object.keys(object.geometry.morphAttributes).length) return;
    const key = [
      object.material.uuid,
      geometryAttributeSignature(object.geometry),
      object.castShadow ? 1 : 0,
      object.receiveShadow ? 1 : 0,
      object.renderOrder
    ].join(':');
    if (!batches.has(key)) batches.set(key, []);
    batches.get(key).push(object);
  });

  let sourceCount = 0;
  let mergedCount = 0;
  for (const objects of batches.values()) {
    if (objects.length < 2) continue;
    const transformed = objects.map(object => {
      const geometry = object.geometry.index ? object.geometry.toNonIndexed() : object.geometry.clone();
      const transform = rootInverse.clone().multiply(object.matrixWorld);
      geometry.applyMatrix4(transform);
      return geometry;
    });
    const mergedGeometry = mergeGeometries(transformed, false);
    transformed.forEach(geometry => geometry.dispose());
    if (!mergedGeometry) continue;

    const source = objects[0];
    const mergedObject = createObject(mergedGeometry, source.material);
    mergedObject.castShadow = source.castShadow;
    mergedObject.receiveShadow = source.receiveShadow;
    mergedObject.renderOrder = source.renderOrder;
    mergedObject.name = `batched-${source.material.name || source.material.uuid}`;
    objects.forEach(object => object.removeFromParent());
    rootGroup.add(mergedObject);
    sourceCount += objects.length;
    mergedCount += 1;
  }
  return { sourceCount, mergedCount };
}

function batchStaticMeshes(rootGroup, includeTransparent = false, filter = () => true) {
  return batchStaticObjects(
    rootGroup,
    object => object.isMesh && filter(object) && (includeTransparent || !object.material.transparent),
    (geometry, material) => new THREE.Mesh(geometry, material)
  );
}

function batchStaticLineSegments(rootGroup) {
  return batchStaticObjects(
    rootGroup,
    object => object.isLineSegments,
    (geometry, material) => new THREE.LineSegments(geometry, material)
  );
}

}

function footprintBox(w, d, x, z, parent, rotation = 0) {
  const mesh = new THREE.Mesh(cachedBoxGeometry(w, 18, d), materials.footprint);

  mesh.rotation.y = rotation;

  parent.add(mesh);

  edge.position.copy(mesh.position);
  edge.rotation.copy(mesh.rotation);
  edge.renderOrder = 6;
  parent.add(edge);
}

function makePlanGroups(px, py, angle = 0) {
  const object3d = new THREE.Group();
  const footprint = new THREE.Group();
  const position = planToWorld(px, py);
  object3d.position.copy(position);
  footprint.position.copy(position);
  object3d.rotation.y = planAngleToWorld(angle);
  footprint.rotation.y = planAngleToWorld(angle);
  furniture3dGroup.add(object3d);
  footprintGroup.add(footprint);
  return { object3d, footprint };
}

let sharedChairGeometries;

function getChairGeometries() {
  if (sharedChairGeometries) return sharedChairGeometries;

  const seatShape = new THREE.Shape();
  seatShape.moveTo(-205, -225);
  seatShape.quadraticCurveTo(-250, -215, -250, -155);
  seatShape.lineTo(-250, 165);
  seatShape.quadraticCurveTo(-250, 235, -175, 240);
  seatShape.lineTo(175, 240);
  seatShape.quadraticCurveTo(250, 235, 250, 165);
  seatShape.lineTo(250, -155);
  seatShape.quadraticCurveTo(250, -215, 205, -225);
  seatShape.closePath();

  const backFrameShape = new THREE.Shape();
  backFrameShape.moveTo(-170, 0);
  backFrameShape.bezierCurveTo(-225, 90, -250, 420, -205, 590);
  backFrameShape.quadraticCurveTo(0, 645, 205, 590);
  backFrameShape.bezierCurveTo(250, 420, 225, 90, 170, 0);
  backFrameShape.quadraticCurveTo(0, -20, -170, 0);
  backFrameShape.closePath();

  const backMeshShape = new THREE.Shape();
  backMeshShape.moveTo(-145, 30);
  backMeshShape.bezierCurveTo(-185, 125, -205, 405, -170, 550);
  backMeshShape.quadraticCurveTo(0, 590, 170, 550);
  backMeshShape.bezierCurveTo(205, 405, 185, 125, 145, 30);
  backMeshShape.quadraticCurveTo(0, 12, -145, 30);
  backMeshShape.closePath();

  sharedChairGeometries = {
    seat: new THREE.ExtrudeGeometry(seatShape, {
      depth: 70,
      bevelEnabled: true,
      bevelSegments: 3,
      bevelSize: 9,
      bevelThickness: 8,
      curveSegments: 10
    }),
    backFrame: new THREE.ExtrudeGeometry(backFrameShape, {
      depth: 44,
      bevelEnabled: true,
      bevelSegments: 2,
      bevelSize: 7,
      bevelThickness: 7,
      curveSegments: 12
    }),
    backMesh: new THREE.ExtrudeGeometry(backMeshShape, {
      depth: 20,
      bevelEnabled: true,
      bevelSegments: 2,
      bevelSize: 4,
      bevelThickness: 4,
      curveSegments: 12
    }),
    wheel: new THREE.TorusGeometry(30, 9, 8, 16)
  };
  return sharedChairGeometries;
}

function addChair(x, z, yaw, object3d, footprint) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = yaw;
  const chairGeometry = getChairGeometries();

  // Tapered cushion with a rounded front edge.
  const seat = new THREE.Mesh(chairGeometry.seat, materials.seat);
  seat.rotation.x = Math.PI / 2;
  seat.position.y = 500;
  seat.castShadow = true;
  g.add(seat);

  // A light outer frame and inset dark panel give the back its ergonomic profile.
  const backFrame = new THREE.Mesh(chairGeometry.backFrame, materials.chairFrame);
  backFrame.position.set(0, 500, -270);
  backFrame.rotation.x = -.10;
  backFrame.castShadow = true;
  g.add(backFrame);

  const backMesh = new THREE.Mesh(chairGeometry.backMesh, materials.chair);
  backMesh.position.set(0, 500, -238);
  backMesh.rotation.x = -.10;
  backMesh.castShadow = true;
  g.add(backMesh);

  box(410, 32, 360, materials.chairFrame, 0, 398, -5, g);
  cylinder(25, 300, materials.metal, 0, 100, 0, g, 18);
  cylinder(42, 95, materials.chairFrame, 0, 55, 0, g, 18);

  for (const side of [-1, 1]) {
    const support = box(36, 225, 42, materials.chairFrame, side * 245, 455, -45, g);
    support.rotation.z = side * .16;
    box(72, 34, 185, materials.chair, side * 255, 680, 40, g);
  }

  cylinder(58, 50, materials.chairFrame, 0, 45, 0, g, 18);
  for (let i = 0; i < 5; i++) {
    const a = i * Math.PI * 2 / 5;
    const spoke = box(330, 24, 42, materials.chairFrame, Math.cos(a) * 165, 48, Math.sin(a) * 165, g);
    spoke.rotation.y = -a;
    const wheel = new THREE.Mesh(chairGeometry.wheel, materials.chair);
    wheel.position.set(Math.cos(a) * 330, 31, Math.sin(a) * 330);
    wheel.rotation.y = -a;
    wheel.castShadow = true;
    g.add(wheel);
  }
  object3d.add(g);
  footprintBox(630, 655, x, z, footprint, yaw);
  return g;
}

function workstationMarkerStatus(assignment) {
  if (assignment?.status === 'vacant') return 'vacant';
  if (assignment?.status === 'unknown') return 'unknown';
  if (assignment?.role === '研究助理教授') return 'faculty';
  if (assignment?.role === '博士后研究员') return 'postdoc';
  if (assignment?.role === '博士生') return 'phd';
  if (assignment?.role === 'Incoming Student') return 'incoming';
  if (/交换|访问/.test(assignment?.role || '') || /交换|访问/.test(assignment?.note || '')) return 'visitor';
  return 'member';
}

function createWorkstationMarker(workstation) {
  const assignment = workstation.assignment;
  const isVacant = assignment?.status === 'vacant';
  const isUnknown = assignment?.status === 'unknown';
  const marker = document.createElement('button');
  marker.type = 'button';
  marker.className = 'fact-workstation-marker';
  marker.dataset.status = workstationMarkerStatus(assignment);
  marker.dataset.active = 'false';
  marker.dataset.selected = 'false';
  marker.setAttribute('aria-expanded', 'false');
  marker.setAttribute('aria-controls', 'fact-person-panel');

  const photo = document.createElement('span');
  photo.className = 'fact-marker-photo';
  const fallback = document.createElement('span');
  fallback.className = 'fact-marker-fallback';
  fallback.textContent = isVacant ? '—' : isUnknown ? '?' : assignment?.name ? Array.from(assignment.name)[0] : '—';
  photo.append(fallback);

  if (assignment?.photoUrl) {
    const image = document.createElement('img');
    image.alt = '';
    image.referrerPolicy = 'no-referrer';
    image.src = assignment.photoUrl;
    if (assignment.markerPhotoPosition) image.style.objectPosition = assignment.markerPhotoPosition;
    fallback.hidden = true;
    image.addEventListener('error', () => {
      image.hidden = true;
      fallback.hidden = false;
    });
    photo.prepend(image);
  }

  const id = document.createElement('span');
  id.className = 'fact-marker-id';
  id.textContent = workstation.id.slice(1);
  const name = document.createElement('span');
  name.className = 'fact-marker-name';
  marker.append(photo, id, name);
  workstation.markerNameElement = name;
  workstation.markerFallbackElement = fallback;
  refreshWorkstationMarker(workstation, marker);
  marker.addEventListener('pointerenter', event => setHoveredWorkstation(workstation, event));
  marker.addEventListener('pointermove', event => positionWorkstationTooltip(event));
  marker.addEventListener('pointerleave', () => {
    if (pinnedWorkstation !== workstation) setHoveredWorkstation(null);
  });
  marker.addEventListener('click', event => {
    event.stopPropagation();
    if (isPublicView) {
      setSelectedWorkstation(selectedWorkstation === workstation ? null : workstation);
      setHoveredWorkstation(null);
      return;
    }
    pinnedWorkstation = pinnedWorkstation === workstation ? null : workstation;
    setHoveredWorkstation(pinnedWorkstation, event);
  });
  workstationMarkers.append(marker);
  return marker;
}

function refreshWorkstationMarker(workstation, marker = workstation.marker) {
  const assignment = workstation.assignment;
  const names = personNames(assignment);
  const occupant = localizedOccupantName(assignment);
  const accessibleName = names.secondary ? `${names.primary} (${names.secondary})` : names.primary || occupant;
  marker.setAttribute('aria-label', `${workstation.id} ${accessibleName} · ${localizedZone(workstation.zone)}`);
  workstation.markerNameElement.textContent = assignment?.name || occupant;
  if (assignment?.status === 'vacant') workstation.markerFallbackElement.textContent = currentLanguage === 'en' ? '—' : '空';
}

function addWorkstationChair(x, z, yaw, object3d, footprint, zone) {

  workstations.push({ id, zone, chair, assignment: WORKSTATION_ASSIGNMENTS[id] || null });
  return chair;
}

function buildWorkstationUi() {
  for (const workstation of workstations) {
    workstation.chair.updateWorldMatrix(true, false);
    const worldPosition = workstation.chair.getWorldPosition(new THREE.Vector3());
    workstation.worldPosition = worldPosition;

    const hitTarget = new THREE.Mesh(
      cachedCylinderGeometry(420, 1200, 20),
      workstationHitMaterial
    );
    hitTarget.position.set(worldPosition.x, 600, worldPosition.z);
    hitTarget.userData.workstation = workstation;
    workstationUiGroup.add(hitTarget);
    workstationHitTargets.push(hitTarget);
    workstation.hitTarget = hitTarget;

    workstation.marker = createWorkstationMarker(workstation);
  }
}

function chairYawToward(x, z, targetX = 0, targetZ = 0) {
  // A chair's local +Z direction is its seated facing direction; the backrest sits at -Z.
  return Math.atan2(targetX - x, targetZ - z);
}

  // face of the 120 mm wall while its width follows the wall centreline.

  box(width - side * 2, 40, shelfDepth, materials.cabinetWood, 0, 820, shelfZ, object3d);
  box(width - side * 2, 32, shelfDepth, materials.cabinetWood, 0, 1508, shelfZ, object3d);

  }

  footprintBox(width, depth, 0, zCenter, footprint);
}

const FAN_DEPTH = 1100;
const FAN_REFERENCE_DEPTH = 1200;
const FAN_OUTER_ARC = 2300;
const FAN_INNER_ARC = 1260;
// The original diameter and angle match the plan. Keep that curvature, then
// move only the inner arc so each radial edge follows the 1100 mm plan fit.
const FAN_OUTER_RADIUS = FAN_REFERENCE_DEPTH * FAN_OUTER_ARC / (FAN_OUTER_ARC - FAN_INNER_ARC);
const FAN_INNER_RADIUS = FAN_OUTER_RADIUS - FAN_DEPTH;
const FAN_MID_RADIUS = (FAN_INNER_RADIUS + FAN_OUTER_RADIUS) / 2;
const FAN_SPAN = FAN_OUTER_ARC / FAN_OUTER_RADIUS;

function annularFanShape() {
  const shape = new THREE.Shape();
  shape.moveTo(FAN_INNER_RADIUS - FAN_MID_RADIUS, 0);
  shape.lineTo(FAN_OUTER_RADIUS - FAN_MID_RADIUS, 0);
  shape.absarc(-FAN_MID_RADIUS, 0, FAN_OUTER_RADIUS, 0, -FAN_SPAN, true);
  shape.lineTo(
    -FAN_MID_RADIUS + Math.cos(-FAN_SPAN) * FAN_INNER_RADIUS,
    Math.sin(-FAN_SPAN) * FAN_INNER_RADIUS
  );
  shape.absarc(-FAN_MID_RADIUS, 0, FAN_INNER_RADIUS, -FAN_SPAN, 0, false);
  shape.closePath();
  return shape;
}

}

// A clipped, low-contrast grid belongs to the public floor itself. The
// calibration grid remains separate and keeps its original millimetre guides.
function clippedGridSegments(spacing, omitMajorLines = false) {
  const segments = [];
  const xs = roomWorld.map(point => point.x);
  const zs = roomWorld.map(point => point.z);
  const addClippedLine = (axis, value) => {
    const intersections = [];
    for (let i = 0; i < roomWorld.length; i++) {
      const a = roomWorld[i];
      const b = roomWorld[(i + 1) % roomWorld.length];
      const aCoordinate = axis === 'x' ? a.x : a.z;
      const bCoordinate = axis === 'x' ? b.x : b.z;
      if (!((aCoordinate <= value && bCoordinate > value) || (bCoordinate <= value && aCoordinate > value))) continue;
      const t = (value - aCoordinate) / (bCoordinate - aCoordinate);
      intersections.push(axis === 'x'
        ? a.z + (b.z - a.z) * t
        : a.x + (b.x - a.x) * t);
    }
    intersections.sort((a, b) => a - b);
    for (let i = 0; i + 1 < intersections.length; i += 2) {
      segments.push(axis === 'x'
        ? new THREE.Vector3(value, -8, intersections[i])
        : new THREE.Vector3(intersections[i], -8, value));
      segments.push(axis === 'x'
        ? new THREE.Vector3(value, -8, intersections[i + 1])
        : new THREE.Vector3(intersections[i + 1], -8, value));
    }
  };
  const addAxisLines = (axis, minimum, maximum) => {
    for (let value = Math.ceil(minimum / spacing) * spacing; value <= maximum; value += spacing) {
      if (omitMajorLines && Math.abs(value % 1000) < .01) continue;
      addClippedLine(axis, value);
    }
  };
  addAxisLines('x', Math.min(...xs), Math.max(...xs));
  addAxisLines('z', Math.min(...zs), Math.max(...zs));
  return segments;
}

function wallBetween(planA, planB, material = materials.wall) {
  const a = planToWorld(...planA);
  const b = planToWorld(...planB);
  const dx = b.x - a.x;
  const dz = b.z - a.z;
  const length = Math.hypot(dx, dz);
  const wall = box(length, 2500, 120, material, (a.x + b.x) / 2, 0, (a.z + b.z) / 2, shell3dGroup);
  wall.rotation.y = -Math.atan2(dz, dx);
  if (material === materials.wall) registerCameraFadeWall(wall);
  return wall;
}

function curvedWallBetween(
  planPoints,
  material = materials.wall,
  thickness = 120,
  baseY = 0,
  height = 2500,
  capEnds = true,
  includeHorizontalFaces = true,
  horizontalMaterial = null,
  tangentReferencePoints = null
) {
  const points = planPoints.map(([px, py]) => planToWorld(px, py));
  const reference = tangentReferencePoints?.map(([px, py]) => planToWorld(px, py)) || null;
  const half = thickness / 2;
  const vertices = [];
  for (let i = 0; i < points.length; i++) {
    let prev = points[Math.max(0, i - 1)];
    let next = points[Math.min(points.length - 1, i + 1)];
    if (reference?.length > 1) {
      let referenceIndex = 0;
      let referenceDistance = Infinity;
      for (let j = 0; j < reference.length; j++) {
        const distance = points[i].distanceToSquared(reference[j]);
        if (distance < referenceDistance) {
          referenceDistance = distance;
          referenceIndex = j;
        }
      }
      prev = reference[Math.max(0, referenceIndex - 1)];
      next = reference[Math.min(reference.length - 1, referenceIndex + 1)];
    }
    const tx = next.x - prev.x;
    const tz = next.z - prev.z;
    const length = Math.hypot(tx, tz) || 1;
    const nx = -tz / length;
    const nz = tx / length;
    const left = [points[i].x + nx * half, baseY, points[i].z + nz * half];
    const right = [points[i].x - nx * half, baseY, points[i].z - nz * half];
    vertices.push(left[0], left[1], left[2], right[0], right[1], right[2]);
    vertices.push(left[0], baseY + height, left[2], right[0], baseY + height, right[2]);
  }
  const indices = [];
  for (let i = 0; i < points.length - 1; i++) {
    const a = i * 4;
    const b = (i + 1) * 4;
    indices.push(a, b, a + 2, a + 2, b, b + 2); // outside face
    indices.push(a + 1, a + 3, b + 1, b + 1, a + 3, b + 3); // inside face
    if (includeHorizontalFaces) {
      indices.push(a + 2, b + 2, a + 3, a + 3, b + 2, b + 3); // top
      indices.push(a, a + 1, b, b, a + 1, b + 1); // bottom
    }
  }
  if (capEnds) {
    indices.push(0, 2, 1, 1, 2, 3);
    const end = (points.length - 1) * 4;
    indices.push(end, end + 1, end + 2, end + 1, end + 3, end + 2);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  if (includeHorizontalFaces && horizontalMaterial) {
    const verticalIndices = [];
    const horizontalIndices = [];
    for (let i = 0; i < points.length - 1; i++) {
      const a = i * 4;
      const b = (i + 1) * 4;
      verticalIndices.push(a, b, a + 2, a + 2, b, b + 2);
      verticalIndices.push(a + 1, a + 3, b + 1, b + 1, a + 3, b + 3);
      horizontalIndices.push(a + 2, b + 2, a + 3, a + 3, b + 2, b + 3);
      horizontalIndices.push(a, a + 1, b, b, a + 1, b + 1);
    }
    if (capEnds) {
      verticalIndices.push(0, 2, 1, 1, 2, 3);
      const end = (points.length - 1) * 4;
      verticalIndices.push(end, end + 1, end + 2, end + 1, end + 3, end + 2);
    }
    geometry.setIndex([...verticalIndices, ...horizontalIndices]);
    geometry.addGroup(0, verticalIndices.length, 0);
    geometry.addGroup(verticalIndices.length, horizontalIndices.length, 1);
  } else {
    geometry.setIndex(indices);
  }
  geometry.computeVertexNormals();
  const wall = new THREE.Mesh(geometry, horizontalMaterial ? [material, horizontalMaterial] : material);
  wall.castShadow = true;
  wall.receiveShadow = true;
  shell3dGroup.add(wall);
  if (material === materials.wall) registerCameraFadeWall(wall);
  return wall;
}

// Each window gets its own curved image segment. Keeping the geometry inside
// the opening prevents the scene from reading as an exterior billboard; the
// group visibility is controlled by the camera's side relative to the wall.
function addWindowViewBackdrop() {
  const texture = new THREE.TextureLoader().load('./assets/sea-view.jpg', requestRender);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = THREE.ClampToEdgeWrapping;
  texture.wrapT = THREE.ClampToEdgeWrapping;
  const material = new THREE.MeshBasicMaterial({
    map: texture,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: .96,
    depthWrite: false,
    depthTest: true
  });
  // Keep the view just outside the glazing so the transparent pane renders in
  // front of it from the room side instead of looking like a pasted surface.
  const offset = 80;
  const addWindowSegment = planPoints => {
    const path = planPoints.map(([px, py]) => planToWorld(px, py));
    const planStartX = curvedTopStart[0];
    const planWidth = curvedTopEnd[0] - planStartX;
    const vertices = [];
    const uvs = [];
    for (let i = 0; i < path.length; i++) {
      const prev = path[Math.max(0, i - 1)];
      const next = path[Math.min(path.length - 1, i + 1)];
      const tx = next.x - prev.x;
      const tz = next.z - prev.z;
      const length = Math.hypot(tx, tz) || 1;
      const outwardX = tz / length;
      const outwardZ = -tx / length;
      const x = path[i].x + outwardX * offset;
      const z = path[i].z + outwardZ * offset;
      vertices.push(x, WINDOW_SILL_HEIGHT + 2, z, x, WINDOW_HEAD_HEIGHT - 2, z);
      const u = (planPoints[i][0] - planStartX) / planWidth;
      uvs.push(u, .18, u, .82);
    }
    const indices = [];
    for (let i = 0; i < path.length - 1; i++) {
      const base = i * 2;
      const next = base + 2;
      indices.push(base, next, base + 1, base + 1, next, next + 1);
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
    geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geometry.setIndex(indices);
    geometry.computeVertexNormals();
    const backdrop = new THREE.Mesh(geometry, material);
    backdrop.renderOrder = 0;
    windowViewGroup.add(backdrop);
    const centerPlan = planPoints[Math.floor(planPoints.length / 2)];
    windowBackdropMeshes.push({ mesh: backdrop, center: planToWorld(...centerPlan) });

  };
  for (const [windowStartX, windowEndX] of TOP_WINDOW_RANGES) {
    addWindowSegment(planSliceBetweenX(curvedTopPlan, windowStartX, windowEndX));
  }
}

function addDoorLeaf(planHinge, planClosedEnd, inwardSwingAngle, isGlass = false) {
  const hinge = planToWorld(...planHinge);
  const closedEnd = planToWorld(...planClosedEnd);
  const dx = closedEnd.x - hinge.x;
  const dz = closedEnd.z - hinge.z;
  const width = Math.hypot(dx, dz);
  // Doors are normally shown closed. inwardSwingAngle records the correct
  // opening direction for a later animated/open-state view.
  const openFraction = 0;
  const openAngle = Math.atan2(dz, dx) + inwardSwingAngle * openFraction;
  const group = new THREE.Group();
  group.position.copy(hinge);
  group.rotation.y = -openAngle;
  shell3dGroup.add(group);

  if (isGlass) {
    box(width - 90, 2110, 24, materials.doorGlass, width / 2, 45, 0, group);
    box(55, 2200, 55, materials.metal, 27.5, 0, 0, group);
    box(55, 2200, 55, materials.metal, width - 27.5, 0, 0, group);
    box(width, 55, 55, materials.metal, width / 2, 0, 0, group);
    box(width, 55, 55, materials.metal, width / 2, 2145, 0, group);
  } else {
    box(width, 2200, 45, materials.door, width / 2, 0, 0, group);
    box(55, 2250, 75, materials.metal, 0, 0, 0, group);
  }
  for (const faceZ of [-52, 52]) {
    box(36, 90, 70, materials.metal, width - 140, 1020, faceZ, group);
  }
}

function addSingleDoor(planA, planB, swingAngle) {

function addDoubleDoor(planA, planB, isGlass = false) {
  const midpoint = [(planA[0] + planB[0]) / 2, (planA[1] + planB[1]) / 2];
  addDoorLeaf(planA, midpoint, -Math.PI / 2, isGlass);
  addDoorLeaf(planB, midpoint, Math.PI / 2, isGlass);
}

  curvedTopPlan
);
curvedWallBetween(innerRightPlan, materials.wall, 120, 0, 2500, true, true, null, innerWallReferencePlan);
curvedWallBetween(innerWallBeforeRearDoor, materials.wall, 120, 0, 2500, false, true, null, innerWallReferencePlan);
curvedWallBetween(innerWallAfterRearDoor, materials.wall, 120, 0, 2500, false, true, null, innerWallReferencePlan);
curvedWallBetween([backDoorLeftPlan, curvedTopStart], materials.wall, 120, 0, 2500, false);
// Both doors are closed by default and swing into 2008A when opened.
addDoubleDoor(frontDoorLeftPlan, frontDoorRightPlan, true);
// From inside the room the handle is on the left: in plan view that is the
// right end of this wall segment, with the hinges on the left.
addSingleDoor(rearDoorLeftPlan, rearDoorRightPlan, -Math.PI / 2);

// The doors sit in openings below continuous 250 mm wall lintels.
curvedWallBetween(frontDoorLintelPlan, materials.wall, 120, 2250, 250, false, true, materials.wallReveal, innerWallReferencePlan);
curvedWallBetween(planSliceBetweenX(innerMainPlan, rearDoorLeftX, rearDoorRightX), materials.wall, 120, 2250, 250, false, true, materials.wallReveal, innerWallReferencePlan);

const roomLinePoints = [...roomWorld, roomWorld[0]].map(p => new THREE.Vector3(p.x, 42, p.z));
roomOutlineGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(roomLinePoints), materials.roomEdge));

const gridPoints = [];
for (let x = 0; x <= 16000; x += 1000) {
  gridPoints.push(new THREE.Vector3(x, 24, -600), new THREE.Vector3(x, 24, 8600));
}
for (let z = 0; z <= 8000; z += 1000) {
  gridPoints.push(new THREE.Vector3(-600, 24, z), new THREE.Vector3(16600, 24, z));
}
gridGroup.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(gridPoints), materials.grid));
if (!isPublicView) {
  roomOutlineGroup.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0,55,0), new THREE.Vector3(1000,55,0),
    new THREE.Vector3(0,55,0), new THREE.Vector3(0,55,1000)
  ]), new THREE.LineBasicMaterial({ color: 0x57b5a7, depthTest: false })));
}

const furnitureBatch = batchStaticMeshes(furniture3dGroup);
const shellBatch = batchStaticMeshes(
  shell3dGroup,
  false,
  object => !object.userData.cameraFadeWall
);
const footprintMeshBatch = batchStaticMeshes(footprintGroup, true);
const footprintLineBatch = batchStaticLineSegments(footprintGroup);
const chairGroups = [];
furniture3dGroup.traverse(object => {
  if (object.isGroup && object.children.filter(child => (
    child.isMesh && child.material === materials.chair
  )).length > 1) chairGroups.push(object);
});
const chairBatches = chairGroups.map(group => batchStaticObjects(
  group,
  object => object.isMesh && object.material === materials.chair,
  (geometry, material) => new THREE.Mesh(geometry, material)
));
const chairBatch = chairBatches.reduce((total, batch) => ({
  sourceCount: total.sourceCount + batch.sourceCount,
  mergedCount: total.mergedCount + batch.mergedCount
}), { sourceCount: 0, mergedCount: 0 });
root.dataset.batchedSources = String(
  furnitureBatch.sourceCount + shellBatch.sourceCount
  + footprintMeshBatch.sourceCount + footprintLineBatch.sourceCount
  + chairBatch.sourceCount
);
root.dataset.batchedDraws = String(
  furnitureBatch.mergedCount + shellBatch.mergedCount
  + footprintMeshBatch.mergedCount + footprintLineBatch.mergedCount
  + chairBatch.mergedCount
);
renderer.shadowMap.needsUpdate = true;

let renderFrameId = 0;
let controlsInteracting = false;
let cameraWasAdjusted = false;
let hoveredWorkstation = null;
let pinnedWorkstation = null;
let selectedWorkstation = null;
let pinnedRoleFilter = null;
let previewRoleFilter = null;
const roleLegend = document.querySelector('.fact-role-legend');
const roleFilterButtons = [...roleLegend.querySelectorAll('[data-role-filter]')];
const cameraHorizontal = new THREE.Vector3();
const wallHorizontal = new THREE.Vector3();
const wallWorldCenter = new THREE.Vector3();
const workstationPointer = new THREE.Vector2();
const workstationRaycaster = new THREE.Raycaster();
const workstationTooltip = document.getElementById('fact-workstation-tooltip');
const workstationIdText = document.getElementById('fact-workstation-id');
const workstationNameText = document.getElementById('fact-workstation-name');
const workstationEnglishText = document.getElementById('fact-workstation-english');
const workstationRoleText = document.getElementById('fact-workstation-role');
const workstationMetaText = document.getElementById('fact-workstation-meta');
const workstationPhoto = document.getElementById('fact-workstation-photo');
const workstationPhotoFallback = document.getElementById('fact-workstation-photo-fallback');
const personPanel = document.getElementById('fact-person-panel');
const detailPhoto = document.getElementById('fact-detail-photo');
const detailPhotoFallback = document.getElementById('fact-detail-photo-fallback');
const detailName = document.getElementById('fact-detail-name');
const detailEnglish = document.getElementById('fact-detail-english');
const detailRole = document.getElementById('fact-detail-role');
const detailBio = document.getElementById('fact-detail-bio');
const detailNote = document.getElementById('fact-detail-note');
const detailSeat = document.getElementById('fact-detail-seat');
const detailZone = document.getElementById('fact-detail-zone');
const detailEmail = document.getElementById('fact-detail-email');
const detailProfile = document.getElementById('fact-detail-profile');
const detailClose = document.getElementById('fact-detail-close');
const languageButtons = [...document.querySelectorAll('[data-language]')];

function setLanguage(language) {
  currentLanguage = language === 'zh' ? 'zh' : 'en';
  const text = ui();
  root.dataset.language = currentLanguage;
  document.documentElement.lang = currentLanguage === 'en' ? 'en' : 'zh-Hans';
  document.title = text.documentTitle;
  root.setAttribute('aria-label', text.rootLabel);
  workstationMarkers.setAttribute('aria-label', text.markerRegionLabel);
  document.getElementById('fact-lab-controls').setAttribute('aria-label', text.controlsLabel);
  document.querySelector('.fact-brand').setAttribute('aria-label', text.siteLabel);
  document.getElementById('fact-page-title').textContent = text.pageTitle;
  roleLegend.setAttribute('aria-label', text.roleLegendLabel);
  roleLegend.querySelector('.legend-title').textContent = text.legendTitle;
  document.querySelector('.fact-language-modes').setAttribute('aria-label', text.languageLabel);
  document.querySelector('.fact-view-modes').setAttribute('aria-label', text.viewLabel);
  personPanel.setAttribute('aria-label', text.profileLabel);
  document.getElementById('fact-detail-kicker').textContent = text.profileKicker;
  document.getElementById('fact-detail-seat-label').textContent = text.seat;
  document.getElementById('fact-detail-zone-label').textContent = text.zone;
  document.getElementById('fact-detail-email-label').textContent = text.email;
  document.getElementById('fact-detail-profile-label').textContent = text.profile;
  detailClose.title = text.close;
  detailClose.setAttribute('aria-label', text.close);
  for (const button of languageButtons) {
    button.setAttribute('aria-pressed', String(button.dataset.language === currentLanguage));
  }
  for (const button of roleFilterButtons) {
    button.querySelector('b').textContent = text.roles[button.dataset.roleFilter];
  }
  for (const workstation of workstations) refreshWorkstationMarker(workstation);
  updateSummaryText();
  if (selectedWorkstation) setSelectedWorkstation(selectedWorkstation);
  if (hoveredWorkstation) populateWorkstationTooltip(hoveredWorkstation);
}

for (const button of languageButtons) {
  button.addEventListener('click', () => setLanguage(button.dataset.language));
}

function showWorkstationPhoto(photoUrl, fallbackText) {
  workstationPhotoFallback.textContent = fallbackText;
  workstationPhotoFallback.hidden = Boolean(photoUrl);
  workstationPhoto.hidden = !photoUrl;
  if (photoUrl && workstationPhoto.src !== photoUrl) workstationPhoto.src = photoUrl;
}

workstationPhoto.addEventListener('error', () => {
  workstationPhoto.hidden = true;
  workstationPhotoFallback.hidden = false;
});

function showDetailPhoto(photoUrl, fallbackText) {
  detailPhotoFallback.textContent = fallbackText;
  detailPhotoFallback.hidden = Boolean(photoUrl);
  detailPhoto.hidden = !photoUrl;
  if (photoUrl && detailPhoto.src !== photoUrl) detailPhoto.src = photoUrl;
}

detailPhoto.addEventListener('error', () => {
  detailPhoto.hidden = true;
  detailPhotoFallback.hidden = false;
});

function setSelectedWorkstation(workstation) {
  if (selectedWorkstation) {
    selectedWorkstation.marker.dataset.selected = 'false';
    selectedWorkstation.marker.setAttribute('aria-expanded', 'false');
  }
  selectedWorkstation = workstation;
  if (!workstation) {
    personPanel.hidden = true;
    return;
  }

  workstation.marker.dataset.selected = 'true';
  workstation.marker.setAttribute('aria-expanded', 'true');
  const assignment = workstation.assignment;
  const isVacant = assignment?.status === 'vacant';
  const names = personNames(assignment);
  const displayName = names.primary || localizedOccupantName(assignment);
  const fallbackText = assignment?.name ? Array.from(assignment.name)[0] : isVacant ? '空' : workstation.id;

  personPanel.dataset.status = workstationMarkerStatus(assignment);
  detailName.textContent = displayName;
  detailEnglish.textContent = names.secondary;
  detailEnglish.hidden = !names.secondary;
  detailRole.textContent = localizedRole(assignment);
  const localizedBio = currentLanguage === 'zh' ? assignment?.bioZh || assignment?.bio : assignment?.bio;
  detailBio.textContent = localizedBio || '';
  detailBio.hidden = !localizedBio;
  detailNote.textContent = localizedNote(assignment?.note);
  detailNote.hidden = !assignment?.note;
  detailSeat.textContent = workstation.id;
  detailZone.textContent = localizedZone(workstation.zone);
  detailEmail.href = assignment?.email ? `mailto:${assignment.email}` : '';
  detailEmail.hidden = !assignment?.email;
  detailProfile.href = assignment?.profileUrl || '';
  detailProfile.hidden = !assignment?.profileUrl;
  showDetailPhoto(assignment?.photoUrl, fallbackText);
  personPanel.hidden = false;
}

function applyRoleFilter() {
  const activeFilter = previewRoleFilter || pinnedRoleFilter;
  roleLegend.dataset.filterActive = String(Boolean(activeFilter));
  root.dataset.roleFilter = activeFilter || '';
  for (const button of roleFilterButtons) {
    const role = button.dataset.roleFilter;
    button.setAttribute('aria-pressed', String(role === pinnedRoleFilter));
    button.dataset.roleCurrent = String(role === activeFilter);
  }
  for (const workstation of workstations) {
    if (!activeFilter) {
      delete workstation.marker.dataset.roleMatch;
      continue;
    }
    workstation.marker.dataset.roleMatch = String(workstation.marker.dataset.status === activeFilter);
  }
}

for (const button of roleFilterButtons) {
  const preview = () => {
    previewRoleFilter = button.dataset.roleFilter;
    applyRoleFilter();
  };
  const endPreview = () => {
    previewRoleFilter = null;
    applyRoleFilter();
  };
  button.addEventListener('pointerenter', preview);
  button.addEventListener('pointerleave', endPreview);
  button.addEventListener('focus', preview);
  button.addEventListener('blur', endPreview);
  button.addEventListener('click', () => {
    const role = button.dataset.roleFilter;
    pinnedRoleFilter = pinnedRoleFilter === role ? null : role;
    previewRoleFilter = null;
    applyRoleFilter();
  });
}

detailClose.addEventListener('click', event => {
  event.stopPropagation();
  const previousSelection = selectedWorkstation;
  setSelectedWorkstation(null);
  previousSelection?.marker.focus();
});

document.addEventListener('keydown', event => {
  if (event.key !== 'Escape') return;
  if (selectedWorkstation) setSelectedWorkstation(null);
  if (pinnedRoleFilter || previewRoleFilter) {
    pinnedRoleFilter = null;
    previewRoleFilter = null;
    applyRoleFilter();
  }
});

function positionWorkstationTooltip(event) {
  const bounds = root.getBoundingClientRect();
  const proposedLeft = event.clientX - bounds.left + 14;
  const proposedTop = event.clientY - bounds.top + 14;
  const left = Math.max(10, Math.min(proposedLeft, root.clientWidth - workstationTooltip.offsetWidth - 10));
  const top = Math.max(10, Math.min(proposedTop, root.clientHeight - workstationTooltip.offsetHeight - 10));
  workstationTooltip.style.left = `${left}px`;
  workstationTooltip.style.top = `${top}px`;
}

function populateWorkstationTooltip(workstation) {
  const assignment = workstation.assignment;
  const names = personNames(assignment);
  const displayName = names.primary || localizedOccupantName(assignment);
  workstationIdText.textContent = workstation.id;
  workstationTooltip.dataset.status = workstationMarkerStatus(assignment);
  workstationNameText.textContent = displayName;
  workstationEnglishText.textContent = names.secondary;
  workstationEnglishText.hidden = !names.secondary;
  workstationRoleText.textContent = localizedRole(assignment);
  workstationRoleText.hidden = false;
  workstationMetaText.textContent = [
    localizedZone(workstation.zone),
    localizedNote(assignment?.note)
  ].filter(Boolean).join(' · ');
  showWorkstationPhoto(
    assignment?.photoUrl,
    assignment?.name ? Array.from(assignment.name)[0] : workstation.id
  );
}

function setHoveredWorkstation(workstation, event) {
  if (hoveredWorkstation !== workstation) {
    if (hoveredWorkstation) {
      hoveredWorkstation.marker.dataset.active = 'false';
    }
    hoveredWorkstation = workstation;
    workstationHighlight.visible = Boolean(workstation);
    if (workstation) {
      workstationHighlight.position.x = workstation.worldPosition.x;
      workstationHighlight.position.z = workstation.worldPosition.z;
      workstation.marker.dataset.active = 'true';
      populateWorkstationTooltip(workstation);
      workstationTooltip.hidden = false;
    } else {
      workstationTooltip.hidden = true;
    }
    requestRender();
  }
  if (workstation && event) positionWorkstationTooltip(event);
}

function workstationFromPointer(event) {
  if (!document.getElementById('fact-toggle-workstations').checked) return null;
  const bounds = canvas.getBoundingClientRect();
  workstationPointer.set(
    (event.clientX - bounds.left) / bounds.width * 2 - 1,
    -(event.clientY - bounds.top) / bounds.height * 2 + 1
  );
  workstationRaycaster.setFromCamera(workstationPointer, activeCamera);
  return workstationRaycaster.intersectObjects(workstationHitTargets, false)[0]?.object.userData.workstation || null;
}

canvas.addEventListener('pointermove', event => {
  if (!pinnedWorkstation) setHoveredWorkstation(workstationFromPointer(event), event);
});
canvas.addEventListener('pointerleave', () => {
  if (!pinnedWorkstation) setHoveredWorkstation(null);
});
canvas.addEventListener('click', () => {
  if (isPublicView) setSelectedWorkstation(null);
  pinnedWorkstation = null;
  setHoveredWorkstation(null);
});

function updateCameraFacingWalls() {
  const xrayEnabled = viewMode === '3d'
    && document.getElementById('fact-toggle-wall-xray').checked
    && document.getElementById('fact-toggle-shell').checked;
  cameraHorizontal.set(
    perspective.position.x - roomCenter.x,
    0,
    perspective.position.z - roomCenter.z
  );
  if (cameraHorizontal.lengthSq() > 0) cameraHorizontal.normalize();

  let changed = false;
  for (const entry of cameraFadeWalls) {
    entry.wall.updateWorldMatrix(true, false);
    wallWorldCenter.copy(entry.localCenter).applyMatrix4(entry.wall.matrixWorld);
    wallHorizontal.set(
      wallWorldCenter.x - roomCenter.x,
      0,
      wallWorldCenter.z - roomCenter.z
    );
    const alignment = wallHorizontal.lengthSq() > 0
      ? wallHorizontal.normalize().dot(cameraHorizontal)
      : -1;
    const faded = xrayEnabled && alignment > .12;
    if (faded === entry.faded) continue;
    entry.faded = faded;
    entry.wall.material = faded ? materials.wallFade : entry.baseMaterial;
    entry.wall.castShadow = !faded;
    entry.wall.receiveShadow = !faded;
    entry.outline.visible = faded;
    changed = true;
  }
  if (changed) renderer.shadowMap.needsUpdate = true;
}

function updateWorkstationMarkerPositions() {
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  const visibleMarkers = [];
  for (const workstation of workstations) {
    markerProjection.set(workstation.worldPosition.x, 1370, workstation.worldPosition.z).project(activeCamera);
    const visible = markerProjection.z >= -1 && markerProjection.z <= 1
      && markerProjection.x >= -1.08 && markerProjection.x <= 1.08
      && markerProjection.y >= -1.08 && markerProjection.y <= 1.08;
    workstation.marker.hidden = !visible;
    if (!visible) continue;
    workstation.marker.style.left = `${(markerProjection.x * .5 + .5) * width}px`;
    workstation.marker.style.top = `${(-markerProjection.y * .5 + .5) * height}px`;
    visibleMarkers.push({ workstation, depth: markerProjection.z, originalIndex: visibleMarkers.length });
  }

  // Keep markers above the canvas for reliable interaction, while ordering
  // overlapping markers by camera depth. The epsilon and previous order avoid
  // jitter when two seats are nearly coplanar during a drag.
  visibleMarkers.sort((a, b) => {
    const depthDelta = b.depth - a.depth;
    if (Math.abs(depthDelta) > 0.0015) return depthDelta;
    return (markerDepthOrder.get(a.workstation.id) ?? a.originalIndex)
      - (markerDepthOrder.get(b.workstation.id) ?? b.originalIndex);
  });
  visibleMarkers.forEach(({ workstation }, index) => {
    markerDepthOrder.set(workstation.id, index);
    workstation.marker.style.setProperty('--fact-marker-depth', String(index + 1));
  });
}

function requestRender() {
  if (!renderFrameId) renderFrameId = requestAnimationFrame(renderFrame);
}

function updateWindowViewVisibility() {
  const cameraFromWindow = perspective.position.clone().sub(windowReferenceWorld);
  const xrayEnabled = viewMode === '3d'
    && document.getElementById('fact-toggle-wall-xray').checked
    && document.getElementById('fact-toggle-shell').checked;
  windowViewGroup.visible = viewMode === '3d' && cameraFromWindow.dot(windowFrontNormal) > 0;
  for (let i = 0; i < windowGlassPanes.length; i++) {
    const pane = windowGlassPanes[i];
    const wallDirection = pane.center.clone().sub(roomCenter).setY(0).normalize();
    const faded = xrayEnabled && cameraHorizontal.dot(wallDirection) > .12;
    pane.mesh.material.opacity = faded ? .04 : pane.baseOpacity;
    if (windowBackdropMeshes[i]) windowBackdropMeshes[i].mesh.visible = !faded;
  }
}

function renderFrame() {
  renderFrameId = 0;
  const moving = controls.enabled && controls.update();
  updateCameraFacingWalls();
  updateWindowViewVisibility();
  renderer.render(scene, activeCamera);
  updateWorkstationMarkerPositions();
  root.dataset.renderCalls = String(renderer.info.render.calls);
  root.dataset.triangles = String(renderer.info.render.triangles);
  if (controlsInteracting || moving) requestRender();
}

controls.addEventListener('start', () => {
  controlsInteracting = true;
  cameraWasAdjusted = true;
  requestRender();
});
controls.addEventListener('change', requestRender);
controls.addEventListener('end', () => {
  controlsInteracting = false;
  requestRender();
});

function setView(mode) {
  viewMode = mode;
  root.dataset.view = mode;
  pinnedWorkstation = null;
  setHoveredWorkstation(null);
  const top = mode === 'top';
  activeCamera = top ? orthographic : perspective;
  controls.enabled = !top;
  floorGroup.visible = isPublicView || !top;
  furniture3dGroup.visible = (isPublicView || !top) && document.getElementById('fact-toggle-model').checked;
  footprintGroup.visible = !isPublicView && top && document.getElementById('fact-toggle-model').checked;
  shell3dGroup.visible = !top && document.getElementById('fact-toggle-shell').checked;
  updateWindowViewVisibility();
  roomOutlineGroup.visible = document.getElementById('fact-toggle-shell').checked;
  document.getElementById('fact-top-view').setAttribute('aria-pressed', String(top));
  document.getElementById('fact-3d-view').setAttribute('aria-pressed', String(!top));
  status.textContent = top
    ? '原点：房间左上内角 (210, 260 px) · 1 px = 12.35 mm · X 向右，Y 向下'
    : '3D 模型仍使用同一毫米坐标；拖动旋转，滚轮缩放，双击恢复视角';
  if (!top) renderer.shadowMap.needsUpdate = true;
  requestRender();
}

document.getElementById('fact-top-view').addEventListener('click', () => setView('top'));
document.getElementById('fact-3d-view').addEventListener('click', () => setView('3d'));
document.getElementById('fact-toggle-plan').addEventListener('change', e => {
  planGroup.visible = e.target.checked;
  requestRender();
});
document.getElementById('fact-toggle-grid').addEventListener('change', e => {
  gridGroup.visible = e.target.checked;
  requestRender();
});
document.getElementById('fact-toggle-shell').addEventListener('change', e => {
  roomOutlineGroup.visible = e.target.checked;
  shell3dGroup.visible = e.target.checked && viewMode === '3d';
  if (viewMode === '3d') renderer.shadowMap.needsUpdate = true;
  requestRender();
});
document.getElementById('fact-toggle-wall-xray').addEventListener('change', () => {
  renderer.shadowMap.needsUpdate = true;
  requestRender();
});
document.getElementById('fact-toggle-workstations').addEventListener('change', event => {
  workstationUiGroup.visible = event.target.checked;
  workstationMarkers.hidden = !event.target.checked;
  if (!event.target.checked) setHoveredWorkstation(null);
  requestRender();
});
document.getElementById('fact-toggle-model').addEventListener('change', e => {
  footprintGroup.visible = e.target.checked && viewMode === 'top' && !isPublicView;
  furniture3dGroup.visible = e.target.checked && (viewMode === '3d' || isPublicView);
  if (viewMode === '3d') renderer.shadowMap.needsUpdate = true;
  requestRender();
});
canvas.addEventListener('dblclick', () => {
  cameraWasAdjusted = false;
  reset3dCamera();
  requestRender();
});

function resize() {
  const width = root.clientWidth;
  const height = isPublicView ? Math.max(560, window.innerHeight) : width < 640 ? 560 : 680;
  renderer.setSize(width, height, false);
  perspective.aspect = width / height;
  perspective.updateProjectionMatrix();
  if (isPublicView && !cameraWasAdjusted) reset3dCamera();
  const roomAspect = 17000 / 9200;
  const viewportAspect = width / height;
  const halfHeight = viewportAspect > roomAspect ? 5100 : 17000 / viewportAspect / 2;
  orthographic.left = -halfHeight * viewportAspect;
  orthographic.right = halfHeight * viewportAspect;
  orthographic.top = halfHeight;
  orthographic.bottom = -halfHeight;
  orthographic.position.set(roomCenter.x, 22000, roomCenter.z);
  orthographic.lookAt(roomCenter);
  orthographic.updateProjectionMatrix();
  requestRender();
}
const handleViewportChange = () => requestAnimationFrame(resize);
window.addEventListener('resize', handleViewportChange);
window.addEventListener('orientationchange', handleViewportChange);
window.visualViewport?.addEventListener('resize', handleViewportChange);
screen.orientation?.addEventListener('change', handleViewportChange);
if (isPublicView) {
  document.getElementById('fact-toggle-plan').checked = false;
  document.getElementById('fact-toggle-grid').checked = false;
  planGroup.visible = false;
  gridGroup.visible = false;
  publicFloorGrid.visible = true;
  setLanguage('en');
}
resize();
setView(isPublicView ? '3d' : 'top');
</script>
</body>
</html>
